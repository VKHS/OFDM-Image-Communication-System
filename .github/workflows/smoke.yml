name: OFDM numerical smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run deterministic numerical smoke tests
        run: python -m unittest discover -s tests -v
      - name: Run clean-channel image reconstruction
        run: python -m ofdm_image.cli --modulation 16QAM --nfft 64 --snr inf --active-bins 48 --cp 16 --output results/noiseless.json
      - name: Generate 45-case BER/EVM scenario table
        run: python -m ofdm_image.sweep --output results/sweep.csv --bytes 512 --seed 1234
      - name: Publish validated numerical outputs
        uses: actions/upload-artifact@v4
        with:
          name: numerical-reference-${{ matrix.python-version }}
          path: |
            results/noiseless.json
            results/sweep.csv
