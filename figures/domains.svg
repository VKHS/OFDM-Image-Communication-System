<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340"><rect width="1000" height="340" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#123049}.title{font-size:25px;font-weight:bold}.h{font-size:19px;font-weight:bold}.sub{font-size:15px}.box{stroke-width:2;rx:16}</style><text class="title" x="35" y="45">FOUR COUPLED DESIGN DOMAINS</text><rect class="box" x="25" y="90" width="225" height="180" fill="#e5f3ff" stroke="#2574a6"/><text class="h" x="43" y="122">1. Representation</text><text class="sub" x="43" y="157">RGB / grayscale</text><text class="sub" x="43" y="183">Bit packing</text><text class="sub" x="43" y="209">Symbol constellations</text><rect class="box" x="267" y="90" width="225" height="180" fill="#fff5db" stroke="#ae8128"/><text class="h" x="285" y="122">2. OFDM / FFT</text><text class="sub" x="285" y="157">IFFT / cyclic prefix</text><text class="sub" x="285" y="183">Radix-2 butterflies</text><text class="sub" x="285" y="209">Delay and twiddle logic</text><rect class="box" x="509" y="90" width="225" height="180" fill="#fceefa" stroke="#9b5593"/><text class="h" x="527" y="122">3. Channel / I-Q</text><text class="sub" x="527" y="157">Baseband / RF</text><text class="sub" x="527" y="183">AWGN and scaling</text><text class="sub" x="527" y="209">ADC / DAC effects</text><rect class="box" x="751" y="90" width="225" height="180" fill="#e8f7ec" stroke="#2d9250"/><text class="h" x="769" y="122">4. Verification</text><text class="sub" x="769" y="157">FFT / demapping</text><text class="sub" x="769" y="183">BER, EVM, images</text><text class="sub" x="769" y="209">Latency and evidence</text><text class="sub" x="35" y="313">Specification → numerical reference → model-level simulation → bit-accurate RTL → FPGA/RF measurements</text></svg>