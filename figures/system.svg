<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><title>End-to-end OFDM image communication system</title><rect width="1200" height="440" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#10283f}.h{font-size:25px;font-weight:bold}.s{font-size:14px}.t{font-size:18px;font-weight:bold}.b{fill:white;stroke:#12628f;stroke-width:2}.q{fill:#e7f5fc;stroke:#1478a0;stroke-width:2}.r{fill:#e9f7ef;stroke:#22825b;stroke-width:2}.a{stroke:#263b4e;stroke-width:2.4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#263b4e"/></marker></defs><text class="h" x="30" y="46">OFDM IMAGE COMMUNICATION SYSTEM</text><text class="s" x="30" y="72">Reversible source bits · QPSK / 16-PSK / 16-QAM · FFT/IFFT · baseband/RF scenarios</text><g><rect class="b" x="22" y="135" width="150" height="75" rx="13"/><text class="t" x="97" y="164" text-anchor="middle">Image input</text><text class="s" x="97" y="187" text-anchor="middle">Byte → bit stream</text><rect class="b" x="198" y="135" width="156" height="75" rx="13"/><text class="t" x="276" y="164" text-anchor="middle">Modulation</text><text class="s" x="276" y="187" text-anchor="middle">Complex symbols</text><rect class="q" x="380" y="135" width="156" height="75" rx="13"/><text class="t" x="458" y="164" text-anchor="middle">OFDM IFFT</text><text class="s" x="458" y="187" text-anchor="middle">N bins + prefix</text><rect class="q" x="562" y="135" width="156" height="75" rx="13"/><text class="t" x="640" y="164" text-anchor="middle">Channel</text><text class="s" x="640" y="187" text-anchor="middle">I/Q · AWGN · ADC</text><rect class="r" x="744" y="135" width="132" height="75" rx="13"/><text class="t" x="810" y="164" text-anchor="middle">OFDM FFT</text><text class="s" x="810" y="187" text-anchor="middle">Carrier recovery</text><rect class="r" x="902" y="135" width="136" height="75" rx="13"/><text class="t" x="970" y="164" text-anchor="middle">Demap</text><text class="s" x="970" y="187" text-anchor="middle">Bit decisions</text><rect class="r" x="1064" y="135" width="114" height="75" rx="13"/><text class="t" x="1121" y="164" text-anchor="middle">Image out</text><text class="s" x="1121" y="187" text-anchor="middle">Reconstruct</text></g><path class="a" d="M172 173 H196 M354 173 H378 M536 173 H560 M718 173 H742 M876 173 H900 M1038 173 H1062"/><path class="a" d="M94 211 V344 H527"/><path class="a" d="M970 211 V344 H680"/><rect class="b" x="528" y="315" width="152" height="64" rx="12"/><text class="t" x="604" y="341" text-anchor="middle">BER / image</text><text class="s" x="604" y="363" text-anchor="middle">aligned comparison</text><text class="s" x="20" y="418">DESIGN illustration · author: Vahab Khalili · physical RF and FPGA are separate validation gates</text></svg>