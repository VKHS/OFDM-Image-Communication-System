<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385"><rect width="960" height="385" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#183047}.h{font-size:25px;font-weight:bold}.t{font-size:18px;font-weight:bold}.s{font-size:16px}.a{stroke:#314c67;stroke-width:2.6;fill:none;marker-end:url(#head)}.b{stroke:#28739b;stroke-width:2.2;fill:#e4f3fd}</style><defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314c67"/></marker></defs><text class="h" x="28" y="43">RADIX-2 DIF BUTTERFLY · COMPLEX ARITHMETIC</text><text class="t" x="36" y="146">a</text><text class="t" x="36" y="280">b</text><path class="a" d="M60 140 H318"/><path class="a" d="M60 276 H318"/><circle class="b" cx="345" cy="140" r="29"/><text class="t" x="345" y="146" text-anchor="middle">+</text><circle class="b" cx="345" cy="275" r="29"/><text class="t" x="345" y="281" text-anchor="middle">−</text><path class="a" d="M90 275 C174 275 174 140 314 140"/><path class="a" d="M90 140 C174 140 174 275 314 275"/><path class="a" d="M375 140 H855"/><path class="a" d="M375 275 H496"/><rect class="b" x="503" y="237" width="207" height="76" rx="11"/><text class="t" x="606" y="266" text-anchor="middle">Twiddle multiply</text><text class="s" x="606" y="289" text-anchor="middle">W = exp(−j2πk/N)</text><path class="a" d="M712 275 H855"/><text class="t" x="868" y="146">u = a+b</text><text class="t" x="868" y="281" text-anchor="middle">v</text><text class="s" x="28" y="351">Lower branch: v=(a−b)W. The serial architecture supplies paired operands using delayed feedback storage.</text></svg>