<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"><rect width="1200" height="430" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#17344c}.h{font-size:25px;font-weight:bold}.t{font-size:17px;font-weight:bold}.s{font-size:14px}.b{stroke:#227ea7;stroke-width:2;fill:#e8f5fc}.r{stroke:#22865a;stroke-width:2;fill:#e8f7ef}.a{stroke:#304d66;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#304d66"/></marker></defs><text class="h" x="28" y="42">QUADRATURE TRANSMITTER AND COHERENT RECEIVER</text><text class="s" x="28" y="69">An optional explicit RF simulation scenario; complex-baseband verification does not require this path</text><rect class="b" x="30" y="130" width="160" height="105" rx="12"/><text class="t" x="110" y="170" text-anchor="middle">Complex IFFT</text><text class="s" x="110" y="192" text-anchor="middle">I(t) and Q(t)</text><rect class="b" x="258" y="105" width="202" height="66" rx="10"/><text class="t" x="359" y="133" text-anchor="middle">I × cos(2πfct)</text><text class="s" x="359" y="151" text-anchor="middle">In-phase branch</text><rect class="b" x="258" y="213" width="202" height="66" rx="10"/><text class="t" x="359" y="241" text-anchor="middle">Q × sin(2πfct)</text><text class="s" x="359" y="259" text-anchor="middle">Quadrature branch</text><path class="a" d="M191 166 H229 V137 H255"/><path class="a" d="M191 194 H229 V245 H255"/><rect class="b" x="520" y="145" width="150" height="93" rx="12"/><text class="t" x="595" y="182" text-anchor="middle">Summation</text><text class="s" x="595" y="205" text-anchor="middle">Real RF waveform</text><path class="a" d="M460 137 H487 V175 H518"/><path class="a" d="M460 246 H487 V209 H518"/><rect class="b" x="722" y="145" width="173" height="93" rx="12"/><text class="t" x="808" y="177" text-anchor="middle">RF channel</text><text class="s" x="808" y="199" text-anchor="middle">Noise / impairments</text><path class="a" d="M672 190 H719"/><rect class="r" x="948" y="125" width="213" height="131" rx="12"/><text class="t" x="1054" y="160" text-anchor="middle">Coherent receiver</text><text class="s" x="1054" y="189" text-anchor="middle">Mix I and Q down</text><text class="s" x="1054" y="212" text-anchor="middle">Low-pass + sampling</text><text class="s" x="1054" y="235" text-anchor="middle">Complex FFT input</text><path class="a" d="M895 190 H946"/><text class="s" x="28" y="346">Historical RF parameters: carrier 40 MHz; baseband sample-update 5 MHz; simulation-grid rate 200 MHz.</text><text class="s" x="28" y="373">These are simulation parameters, not measured FPGA clock rates or physical RF validation.</text></svg>