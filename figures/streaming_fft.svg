<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 410"><rect width="1130" height="410" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#18334a}.title{font-size:25px;font-weight:bold}.h{font-size:19px;font-weight:bold}.sub{font-size:14px}.b{stroke:#2676a1;stroke-width:2;fill:#eaf5ff}.p{stroke:#87602a;stroke-width:2;fill:#fff4df}.line{stroke:#24475e;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#24475e"/></marker></defs><text class="title" x="30" y="45">RADIX-2 SERIAL FFT · 16-POINT CONCEPT</text><text class="sub" x="30" y="70">One complex sample per cycle; feedback storage and stage control supply each butterfly operand pair</text><path class="line" d="M28 188 H90"/><g><rect class="b" x="90" y="130" width="210" height="110" rx="12"/><text class="h" x="195" y="159" text-anchor="middle">Stage 1</text><text class="sub" x="195" y="186" text-anchor="middle">Butterfly + W lookup</text><text class="sub" x="195" y="208" text-anchor="middle">Feedback delay: 8</text><rect class="b" x="340" y="130" width="210" height="110" rx="12"/><text class="h" x="445" y="159" text-anchor="middle">Stage 2</text><text class="sub" x="445" y="186" text-anchor="middle">Butterfly + W lookup</text><text class="sub" x="445" y="208" text-anchor="middle">Feedback delay: 4</text><rect class="b" x="590" y="130" width="210" height="110" rx="12"/><text class="h" x="695" y="159" text-anchor="middle">Stage 3</text><text class="sub" x="695" y="186" text-anchor="middle">Butterfly + W lookup</text><text class="sub" x="695" y="208" text-anchor="middle">Feedback delay: 2</text><rect class="b" x="840" y="130" width="210" height="110" rx="12"/><text class="h" x="945" y="159" text-anchor="middle">Stage 4</text><text class="sub" x="945" y="186" text-anchor="middle">Butterfly + W lookup</text><text class="sub" x="945" y="208" text-anchor="middle">Feedback delay: 1</text></g><path class="line" d="M300 188 H338 M550 188 H588 M800 188 H838 M1050 188 H1110"/><rect class="p" x="240" y="290" width="645" height="55" rx="10"/><text class="h" x="562" y="315" text-anchor="middle">Shared control: frame counter · twiddle address · valid</text><text class="sub" x="562" y="335" text-anchor="middle">Output reordering and transform scaling are additional responsibilities</text><text class="sub" x="25" y="387">Conceptual feedback-storage sum = 8 + 4 + 2 + 1 = 15 complex samples, excluding other buffers</text></svg>