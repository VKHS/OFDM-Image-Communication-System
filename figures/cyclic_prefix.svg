<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370"><rect width="1120" height="370" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#183047}.h{font-size:25px;font-weight:bold}.t{font-size:17px;font-weight:bold}.s{font-size:14px}.d{stroke:#226792;stroke-width:1.5;fill:#eaf5ff}.p{stroke:#bb7034;stroke-width:2;fill:#fff0dc}.a{stroke:#31475b;stroke-width:2;fill:none;marker-end:url(#head)}</style><defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#31475b"/></marker></defs><text class="h" x="25" y="42">64-POINT OFDM WITH A 16-SAMPLE CYCLIC PREFIX</text><text class="s" x="25" y="68">48 occupied frequency slots + 16 null slots → 64 useful time samples → 80 transmitted complex samples</text><rect class="d" x="25" y="116" width="450" height="59" rx="7"/><rect class="p" x="475" y="116" width="150" height="59" rx="7"/><text class="t" x="250" y="152" text-anchor="middle">48 data bins</text><text class="t" x="550" y="152" text-anchor="middle">16 zero bins</text><path class="a" d="M646 144 H740"/><rect class="d" x="744" y="115" width="205" height="61" rx="7"/><text class="t" x="846" y="142" text-anchor="middle">64-point IFFT</text><text class="s" x="846" y="162" text-anchor="middle">time-domain x[0:63]</text><text class="s" x="26" y="225">Output frame transmitted on the channel:</text><rect class="p" x="26" y="243" width="210" height="67" rx="8"/><text class="t" x="131" y="274" text-anchor="middle">Cyclic prefix</text><text class="s" x="131" y="296" text-anchor="middle">x[48] ... x[63]</text><rect class="d" x="236" y="243" width="840" height="67" rx="8"/><text class="t" x="656" y="274" text-anchor="middle">Useful OFDM symbol: x[0] ... x[63]</text><text class="s" x="656" y="296" text-anchor="middle">64 complex samples</text><text class="s" x="25" y="348">Receiver removes 16 prefix samples, FFTs the next 64, and selects the same 48 occupied bins.</text></svg>